<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Random Button</title>
<style>
:root{--bg:#fff;--ink:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16161a;--ink:#f2f2f2}}
:root[data-theme="dark"]{--bg:#16161a;--ink:#f2f2f2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:14px;padding:16px 20px}
.logo{font-size:32px;line-height:1;margin:0}
.logo b{display:block;color:#ed1c24;font-weight:400;margin-left:2.2em;margin-top:-2px}
.tabs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tab{font:inherit;font-size:26px;padding:2px 12px;cursor:pointer;color:#000;border:3px solid transparent;transition:transform .1s}
.tab:hover{transform:translateY(-2px)}
.tab[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}
.t-html{background:#ff7f27;border-color:#ed1c24}
.t-py{background:#fff200;border-color:#00a2e8;color:#fff;text-shadow:0 0 2px #0008}
.t-cpp{background:#00a2e8;border-color:#3f48cc;color:#fff}
.t-js{background:#ffc90e;font-size:34px;padding:0 22px}
.t-all{background:#c3c3c3;border-color:#000}
select{font:inherit;font-size:26px;background:#c3c3c3;color:#000;border:3px solid #000;padding:6px 10px;cursor:pointer}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:10px 20px 30px}
.row{display:flex;align-items:center;gap:20px}
.arrow{width:70px;color:var(--ink);animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(10px)}}
.rb{--s:min(62vw,320px);position:relative;width:var(--s);height:calc(var(--s)*.95);border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rb .base{position:absolute;left:0;right:0;top:35%;bottom:0;background:#860018;border-radius:0 0 50% 50%/0 0 30% 30%}
.rb .cap{position:absolute;left:0;right:0;top:0;height:85%;border-radius:50%;border:3px solid #860018;box-sizing:border-box;background:linear-gradient(100deg,#ed1c24 0 62%,#ee5a5c 62%);transition:transform .08s}
.rb .cap::before{content:"";position:absolute;left:30%;top:10%;width:36%;height:12%;background:#fff;border-radius:99px;transform:rotate(4deg)}
.rb .cap::after{content:"";position:absolute;right:16%;top:22%;width:12%;height:12%;background:#fff;border-radius:50%}
.rb:hover .cap{filter:brightness(1.06)}
.rb:active .cap,.rb.down .cap{transform:translateY(9%)}
.rb:focus-visible{outline:3px solid var(--ink);outline-offset:8px;border-radius:50%}
#hint{font-size:22px;margin:0}
#msg{min-height:1.4em;margin:0;font-size:18px;text-align:center}
#note{margin:0;font-size:14px;opacity:.65;text-align:center}
</style>
</head>
<body>
<header>
  <h1 class="logo">Random<b>Button</b></h1>
  <div class="tabs" id="tabs"></div>
  <select id="lang" aria-label="Language"></select>
</header>
<main>
  <div class="row">
    <svg class="arrow" viewBox="0 0 80 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 20H78M62 4L78 20L62 36"/></svg>
    <button class="rb" id="go" aria-label="Random Button"><span class="base"></span><span class="cap"></span></button>
  </div>
  <p id="hint"></p>
  <p id="msg" aria-live="polite"></p>
  <p id="note"></p>
</main>
